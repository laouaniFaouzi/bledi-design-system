<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);box-sizing:border-box}
  .stack{display:flex;flex-direction:column;gap:16px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  #root{padding:20px}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script>window.__DS_BASE__ = "../../";</script>
<script src="../../_ds_bundle.js" onerror="window.__dsBundleMissing=1"></script>
<script src="../../ds-fallback.js?v=17"></script>
</head><body><div id="root"></div>
<script type="text/babel">
(async () => {
try {
const NS = await window.BlediResolve();
const { Button, Badge, Chip, Avatar, Card, Alert, EmptyState, Icon, Field, Input, Textarea, Select, OptionToggle, SegmentedTabs, UnderlineTabs, TopNav, BottomNav, StepProgress, RouteLine, RequestCard, OfficialTripCard, TripBanner, VerificationRow, ProtectionPanel, RatingStars, Checkbox, Switch, CodeInput, PhotoUploader, Dialog, Toast, StatusTimeline, VerifiedMark, VerifiedName } = NS;
function Demo(){
  const [a,setA]=React.useState('requests');
  const [seg,setSeg]=React.useState('all');
  const [u,setU]=React.useState('d');
  return (
    <div className="stack">
      <div style={{border:'1px solid var(--border-default)',borderRadius:'16px',overflow:'hidden'}}>
        <TopNav active={a} onNavigate={setA} logoSrc="../../assets/bledi-logo.png"/>
      </div>
      <SegmentedTabs value={seg} onChange={setSeg} tabs={[
        {value:'all',label:'Voir les demandes'},{value:'mine',label:'Mes demandes'},{value:'offers',label:'Mes propositions'}]}/>
      <UnderlineTabs value={u} onChange={setU} tabs={[
        {value:'d',label:'Mes demandes'},{value:'p',label:'Mes trajets publiés'}]}/>
      <StepProgress step={2} total={5} label="Trajet officiel"/>
      <div style={{maxWidth:390,border:'1px solid var(--border-default)',borderRadius:'16px',overflow:'hidden'}}>
        <BottomNav active="trips"/>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
} catch (e) { document.getElementById('root').textContent = 'DS ERROR: ' + (e && e.stack || e); }
})();
</script>
</body></html>
