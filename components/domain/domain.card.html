<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

</head><body><div id="root"></div>
<script type="text/babel">
(async () => {
try {
const NS = await window.BlediResolve();
const { Button, Badge, Chip, Avatar, Card, Alert, EmptyState, Icon, Field, Input, Textarea, Select, OptionToggle, SegmentedTabs, UnderlineTabs, TopNav, BottomNav, StepProgress, RouteLine, RequestCard, OfficialTripCard, TripBanner, VerificationRow, ProtectionPanel, RatingStars, Checkbox, Switch, CodeInput, PhotoUploader, Dialog, Toast, StatusTimeline, VerifiedMark, VerifiedName } = NS;
function Demo(){
  return (
    <div className="stack">
      <RequestCard
        badges={<>
          <Badge icon={<Icon name="plane" size={13}/>}>Avion</Badge>
          <Badge tone="verified" icon={<Icon name="shield-check" size={13}/>}>Trajet vérifié Bledi</Badge>
          <Badge icon={<Icon name="eye-off" size={13}/>}>Coordonnées masquées</Badge>
          <Badge icon={<Icon name="credit-card" size={13}/>}>Paiement sécurisé</Badge>
        </>}
        category="Recherche accompagnement senior"
        carrier="Air Algérie" flight="AH1009"
        route={{from:'Paris CDG',fromCode:'CDG',fromTime:'10:30',to:'Alger — Houari Boumediene',toCode:'ALG',toTime:'12:35'}}

        message="Je recherche une personne de confiance pour accompagner mon père depuis l'enregistrement jusqu'à la remise à la famille à Alger."

        action={<Button block>Proposer mon aide</Button>}/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
        <OfficialTripCard carrier="Corsica Linea" reference="CL-MRS-AAE-04" route="Marseille → Annaba" date="Jeudi 13 août 2026" times="20:00 → 16:00 (J+1)"/>
        <OfficialTripCard selected carrier="Corsica Linea" reference="CL-MRS-AAE-04" route="Marseille → Annaba" date="Jeudi 20 août 2026" times="20:00 → 16:00 (J+1)"/>
      </div>
      <TripBanner title="Corsica Linea · CL-MRS-AAE-04" route="Marseille → Annaba" schedule="20 août 2026 · 20:00 → 16:00 (J+1)"/>
      <VerificationRow icon={<Icon name="mail" size={16}/>} title="E-mail vérifié" description="Lien de confirmation envoyé à votre adresse."/>
      <VerificationRow icon={<Icon name="id-card" size={16}/>} title="Pièce d'identité validée" description="Vérification via prestataire KYC (Stripe Identity / Mangopay)."/>
      <ProtectionPanel description="Votre paiement est conservé en toute sécurité jusqu'à ce que vous confirmiez la bonne réception de votre colis."
        points={['Transaction sécurisée',"Vérification d'identité",'Support 7j/7']} linkLabel="Besoin d'aide ?"/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
} catch (e) { document.getElementById('root').textContent = 'DS ERROR: ' + (e && e.stack || e); }
