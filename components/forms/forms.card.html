<!-- @dsCard group="Components" viewport="700x740" name="Forms" subtitle="Champs, choix, cases, interrupteurs, code de remise, photos" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);box-sizing:border-box}
  .stack{display:flex;flex-direction:column;gap:16px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  #root{padding:20px}

</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script>window.__DS_BASE__ = "../../";</script>
<script src="../../_ds_bundle.js" onerror="window.__dsBundleMissing=1"></script>
<script src="../../ds-fallback.js?v=17"></script>
</head><body><div id="root"></div>
<script type="text/babel">
(async () => {
try {
const NS = await window.BlediResolve();
const { Button, Badge, Chip, Avatar, Card, Alert, EmptyState, Icon, Field, Input, Textarea, Select, OptionToggle, SegmentedTabs, UnderlineTabs, TopNav, BottomNav, StepProgress, RouteLine, RequestCard, OfficialTripCard, TripBanner, VerificationRow, ProtectionPanel, RatingStars, Checkbox, Switch, CodeInput, PhotoUploader, Dialog, Toast, StatusTimeline, VerifiedMark, VerifiedName } = NS;
function Demo(){
  const [t,setT]=React.useState('avion');
  const [s,setS]=React.useState('fr');
  const [ok,setOk]=React.useState(true);
  const [ok2,setOk2]=React.useState(false);
  const [notif,setNotif]=React.useState(true);
  const [code,setCode]=React.useState('4B7');
  return (
    <div className="stack">
      <Field label="Transport">
        <OptionToggle value={t} onChange={setT} options={[
          {value:'avion',label:'Avion',icon:<Icon name="plane" size={16}/>},
          {value:'bateau',label:'Bateau',icon:<Icon name="ship" size={16}/>}]}/>
      </Field>
      <Field label="Sens">
        <OptionToggle value={s} onChange={setS} options={[
          {value:'fr',label:'France → Algérie'},{value:'dz',label:'Algérie → France'}]}/>
      </Field>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px'}}>
        <Field label="Départ"><Select placeholder="— Choisir —" options={['Marseille','Paris CDG','Lyon']}/></Field>
        <Field label="Arrivée"><Select placeholder="Choisir d'abord un départ" options={['Annaba','Alger','Oran']}/></Field>
      </div>
      <Field label="Description courte" hint="Ajoutez une courte description.">
        <Textarea rows={2} placeholder="Ex. Je recherche une personne pour accompagner mon père de Paris CDG à Alger."/>
      </Field>
      <Checkbox checked={ok} onChange={setOk} label="Je n'accepte que des objets ouverts et photographiés" hint="Vous pouvez refuser une demande à tout moment."/>
      <Checkbox checked={ok2} onChange={setOk2} label="J'ai lu la liste des objets interdits"/>
      <Switch checked={notif} onChange={setNotif} label="Alertes de nouvelles demandes" hint="Sur vos trajets déclarés uniquement."/>
      <Field label="Code de remise" hint="Communiqué au destinataire au moment de la remise.">
        <CodeInput value={code} onChange={setCode}/>
      </Field>
      <PhotoUploader count={2} hint="Deux photos minimum : l'objet entier et un détail lisible."/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
} catch (e) { document.getElementById('root').textContent = 'DS ERROR: ' + (e && e.stack || e); }
})();
</script>
</body></html>
