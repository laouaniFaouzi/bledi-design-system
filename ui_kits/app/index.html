<!-- @startingPoint section="App Bledi" subtitle="App Bledi — parcours complet (demandes, publication, réservations, messages, vérification)" viewport="1024x760" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Bledi — App</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);min-height:100vh}
  main{max-width:var(--container-app);margin:0 auto;padding:var(--space-6) var(--space-5) var(--space-16)}
  @media (max-width: 760px){ .desktop-nav{display:none} .mobile-nav{display:block} }
  @media (min-width: 761px){ .mobile-nav{display:none} }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script>window.__DS_BASE__ = "../../";</script>
<script src="../../_ds_bundle.js" onerror="window.__dsBundleMissing=1"></script>
<script src="../../ds-fallback.js?v=17"></script>
</head><body><div id="root"></div>
<script type="text/babel" data-type="module">
(async () => {
try {
  const NS = await window.BlediResolve();
  const load = async (p) => {
    const src = (await (await fetch(p)).text())
      .split('\n').filter((l) => !/^\s*import\s/.test(l)).join('\n')
      .split('export function').join('function');
    const name = src.match(/^function ([A-Z][A-Za-z0-9]*)/m)[1];
    const code = Babel.transform('function __f(React){' + src + '\nreturn ' + name + ';}', { presets: [['react', { runtime: 'classic' }]] }).code;
    return new Function(code + '\nreturn __f;')()(React);
  };
  const [Requests, Publish, Reservations, Messages, Verification, Profile] = await Promise.all([
    load('./Requests.jsx'), load('./Publish.jsx'), load('./Reservations.jsx'), load('./Messages.jsx'), load('./Verification.jsx'), load('./Profile.jsx'),
  ]);
  const { TopNav, BottomNav } = NS;

  function App() {
    const [page, setPage] = React.useState('requests');
    const go = (p) => setPage(p === 'publish' ? 'publish' : p);
    return (
      <>
        <div className="desktop-nav">
          <TopNav active={page === 'publish' ? 'requests' : page === 'verify' ? 'profile' : page} onNavigate={go} logoSrc="../../assets/bledi-logo.png" />
        </div>
        <main>
          {page === 'requests' ? <Requests NS={NS} /> : null}
          {page === 'publish' ? <Publish NS={NS} onPublished={() => setPage('trips')} /> : null}
          {page === 'trips' ? <Reservations NS={NS} /> : null}
          {page === 'messages' ? <Messages NS={NS} /> : null}
          {page === 'profile' ? <Profile NS={NS} onVerify={() => setPage('verify')} /> : null}
          {page === 'verify' ? <Verification NS={NS} onBack={() => setPage('profile')} /> : null}
        </main>
        <div className="mobile-nav" style={{ position: 'sticky', bottom: 0 }}>
          <BottomNav active={page === 'verify' ? 'profile' : page} onNavigate={go} />
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
} catch (e) {
  document.getElementById('root').textContent = 'DS ERROR: ' + (e && e.message);
}
})();
</script>
</body></html>
