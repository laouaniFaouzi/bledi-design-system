<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);padding:20px;box-sizing:border-box}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
  .sw{border-radius:12px;height:56px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw span{font-size:10px;font-family:var(--font-mono),monospace}
  .grid{display:grid;gap:12px}

</style></head><body>
<div class="grid" style="grid-template-columns:repeat(5,1fr)"><div><div class="sw" style="background:#14161A;border:1px solid var(--border-default)"><span style="color:#fff">#14161A</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--text-primary</div></div><div><div class="sw" style="background:#3D3F42;border:1px solid var(--border-default)"><span style="color:#fff">#3D3F42</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--bledi-ink-700</div></div><div><div class="sw" style="background:#6B6B6B;border:1px solid var(--border-default)"><span style="color:#fff">#6B6B6B</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--text-secondary</div></div><div><div class="sw" style="background:#9A9A98;border:1px solid var(--border-default)"><span style="color:#14161A">#9A9A98</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--text-muted</div></div><div><div class="sw" style="background:#B3402F;border:1px solid var(--border-default)"><span style="color:#fff">#B3402F</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--text-danger</div></div></div>
</body></html>
