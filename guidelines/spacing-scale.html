<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);padding:20px;box-sizing:border-box}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
  .sw{border-radius:12px;height:56px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw span{font-size:10px;font-family:var(--font-mono),monospace}
  .grid{display:grid;gap:12px}

</style></head><body>
<div style="display:flex;align-items:flex-end;gap:10px">
  <div style="text-align:center"><div style="width:22px;background:var(--bledi-green-700);height:var(--space-1);border-radius:3px"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">1</div></div><div style="text-align:center"><div style="width:22px;background:var(--bledi-green-700);height:var(--space-2);border-radius:3px"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">2</div></div><div style="text-align:center"><div style="width:22px;background:var(--bledi-green-700);height:var(--space-3);border-radius:3px"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">3</div></div><div style="text-align:center"><div style="width:22px;background:var(--bledi-green-700);height:var(--space-4);border-radius:3px"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">4</div></div><div style="text-align:center"><div style="width:22px;background:var(--bledi-green-700);height:var(--space-5);border-radius:3px"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">5</div></div><div style="text-align:center"><div style="width:22px;background:var(--bledi-green-700);height:var(--space-6);border-radius:3px"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">6</div></div><div style="text-align:center"><div style="width:22px;background:var(--bledi-green-700);height:var(--space-8);border-radius:3px"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">8</div></div><div style="text-align:center"><div style="width:22px;background:var(--bledi-green-700);height:var(--space-10);border-radius:3px"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">10</div></div><div style="text-align:center"><div style="width:22px;background:var(--bledi-green-700);height:var(--space-12);border-radius:3px"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">12</div></div><div style="text-align:center"><div style="width:22px;background:var(--bledi-green-700);height:var(--space-16);border-radius:3px"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">16</div></div>
  </div>
</body></html>
