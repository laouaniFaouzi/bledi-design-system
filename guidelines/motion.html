<!-- @dsCard group="Brand" viewport="700x140" subtitle="Mouvement — court, une seule courbe" name="Motion" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);padding:20px;box-sizing:border-box}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
  .sw{border-radius:12px;height:56px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw span{font-size:10px;font-family:var(--font-mono),monospace}
  .grid{display:grid;gap:12px}

</style></head><body>
<div style="font-size:13px;line-height:1.7;color:var(--text-primary)">
    <div><code style="font-family:var(--font-mono),monospace;color:var(--text-secondary)">--ease-standard</code> cubic-bezier(0.2, 0, 0, 1) — la seule courbe du système</div>
    <div><code style="font-family:var(--font-mono),monospace;color:var(--text-secondary)">--duration-fast 120ms</code> survol, changement de couleur</div>
    <div><code style="font-family:var(--font-mono),monospace;color:var(--text-secondary)">--duration-base 180ms</code> sélection, ouverture d’accordéon</div>
    <div><code style="font-family:var(--font-mono),monospace;color:var(--text-secondary)">--duration-slow 280ms</code> barre de progression</div>
    <div style="color:var(--text-secondary);margin-top:6px">Pas de rebond, pas de translation d’entrée, pas de parallaxe.</div>
  </div>
</body></html>
