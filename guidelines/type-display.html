<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);padding:20px;box-sizing:border-box}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}

  .sw span{font-size:10px;font-family:var(--font-mono),monospace}
  .grid{display:grid;gap:12px}

</style></head><body>

    <div style="font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.08">Objet oublié au bled ?</div>

  </div>
  <div style="font-size:11px;color:var(--text-secondary);margin-top:12px;font-family:var(--font-mono),monospace">--font-display · Camera Plain 700 / 600 · tracking -0.02em</div>
