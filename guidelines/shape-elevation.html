<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Ombres — quasi nulles sur clair, profondes sur vert" name="Shape Elevation" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);padding:20px;box-sizing:border-box}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
  .sw{border-radius:12px;height:56px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw span{font-size:10px;font-family:var(--font-mono),monospace}
  .grid{display:grid;gap:12px}

</style></head><body>
<div class="row" style="gap:16px">
    <div style="width:150px;height:80px;border-radius:16px;background:var(--surface-card);border:1px solid var(--border-default);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-secondary)">--shadow-card</div>
    <div style="width:150px;height:80px;border-radius:16px;background:var(--surface-card);border:1px solid var(--border-default);box-shadow:var(--shadow-raised);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-secondary)">--shadow-raised</div>
    <div style="width:150px;height:80px;border-radius:16px;background:var(--gradient-panel);box-shadow:var(--shadow-panel);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-on-dark-muted)">--shadow-panel</div>
  </div>
</body></html>
