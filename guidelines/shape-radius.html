<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Rayons — la pilule est la signature Bledi" name="Shape Radius" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);padding:20px;box-sizing:border-box}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
  .sw{border-radius:12px;height:56px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw span{font-size:10px;font-family:var(--font-mono),monospace}
  .grid{display:grid;gap:12px}

</style></head><body>
<div class="row">
  <div style="text-align:center"><div style="width:64px;height:52px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">sm · 8px</div></div><div style="text-align:center"><div style="width:64px;height:52px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md)"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">md · 12px</div></div><div style="text-align:center"><div style="width:64px;height:52px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg)"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">lg · 16px</div></div><div style="text-align:center"><div style="width:64px;height:52px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-xl)"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">xl · 20px</div></div><div style="text-align:center"><div style="width:64px;height:52px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-2xl)"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">2xl · 24px</div></div><div style="text-align:center"><div style="width:64px;height:52px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-pill)"></div><div style="font-size:10px;color:var(--text-secondary);margin-top:6px">pill · 999px</div></div>
  </div>
</body></html>
