<!-- @dsCard group="Colors" viewport="700x150" subtitle="Crème, blanc, gris — 95 % de l’interface" name="Colors Neutrals" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);padding:20px;box-sizing:border-box}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
  .sw{border-radius:12px;height:56px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw span{font-size:10px;font-family:var(--font-mono),monospace}
  .grid{display:grid;gap:12px}

</style></head><body>
<div class="grid" style="grid-template-columns:repeat(6,1fr)"><div><div class="sw" style="background:#FFFDFA;border:1px solid var(--border-default)"><span style="color:#14161A">#FFFDFA</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--bledi-cream-050</div></div><div><div class="sw" style="background:#FDF7F0;border:1px solid var(--border-default)"><span style="color:#14161A">#FDF7F0</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--bledi-cream-100</div></div><div><div class="sw" style="background:#F7F1E8;border:1px solid var(--border-default)"><span style="color:#14161A">#F7F1E8</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--bledi-cream-200</div></div><div><div class="sw" style="background:#FFFFFF;border:1px solid var(--border-default)"><span style="color:#14161A">#FFFFFF</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--bledi-neutral-000</div></div><div><div class="sw" style="background:#F3F2EE;border:1px solid var(--border-default)"><span style="color:#14161A">#F3F2EE</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--bledi-neutral-100</div></div><div><div class="sw" style="background:#EAE6DE;border:1px solid var(--border-default)"><span style="color:#14161A">#EAE6DE</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--bledi-neutral-200</div></div></div>
</body></html>
