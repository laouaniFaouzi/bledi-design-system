<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);padding:20px;box-sizing:border-box}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

    <span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--bledi-gold-600);font-weight:600">Trajet officiel</span>
    <span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary)">Départ · Arrivée</span>
