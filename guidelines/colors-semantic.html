<!-- @dsCard group="Colors" viewport="700x190" subtitle="Rôles sémantiques : à utiliser plutôt que les valeurs de base" name="Colors Semantic" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);padding:20px;box-sizing:border-box}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
  .sw{border-radius:12px;height:56px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw span{font-size:10px;font-family:var(--font-mono),monospace}
  .grid{display:grid;gap:12px}

</style></head><body>
<div class="grid" style="grid-template-columns:repeat(2,1fr)">
  <div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:34px;border-radius:10px;background:var(--color-bg);border:1px solid var(--border-default);flex:0 0 auto"></span><span style="font-size:12px"><code style="font-family:var(--font-mono),monospace">--color-bg</code><br><span style="color:var(--text-secondary)">fond de page</span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:34px;border-radius:10px;background:var(--surface-card);border:1px solid var(--border-default);flex:0 0 auto"></span><span style="font-size:12px"><code style="font-family:var(--font-mono),monospace">--surface-card</code><br><span style="color:var(--text-secondary)">carte</span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:34px;border-radius:10px;background:var(--surface-muted);border:1px solid var(--border-default);flex:0 0 auto"></span><span style="font-size:12px"><code style="font-family:var(--font-mono),monospace">--surface-muted</code><br><span style="color:var(--text-secondary)">bloc gris</span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:34px;border-radius:10px;background:var(--surface-selected);border:1px solid var(--border-default);flex:0 0 auto"></span><span style="font-size:12px"><code style="font-family:var(--font-mono),monospace">--surface-selected</code><br><span style="color:var(--text-secondary)">option choisie</span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:34px;border-radius:10px;background:var(--surface-notice);border:1px solid var(--border-default);flex:0 0 auto"></span><span style="font-size:12px"><code style="font-family:var(--font-mono),monospace">--surface-notice</code><br><span style="color:var(--text-secondary)">règle de sécurité</span></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:34px;border-radius:10px;background:var(--action-primary-bg);border:1px solid var(--border-default);flex:0 0 auto"></span><span style="font-size:12px"><code style="font-family:var(--font-mono),monospace">--action-primary-bg</code><br><span style="color:var(--text-secondary)">action principale</span></span></div>
  </div>
</body></html>
