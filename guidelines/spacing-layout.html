<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Largeurs de colonne : l’app reste étroite même sur desktop" name="Spacing Layout" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);padding:20px;box-sizing:border-box}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
  .sw{border-radius:12px;height:56px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw span{font-size:10px;font-family:var(--font-mono),monospace}
  .grid{display:grid;gap:12px}

</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px;font-size:12px">
    <div><div style="height:14px;background:var(--bledi-green-700);border-radius:4px;width:50.7%"></div><span style="color:var(--text-secondary)">--container-app · 568px — listes, formulaires, tout le produit</span></div>
    <div><div style="height:14px;background:var(--bledi-gold-400);border-radius:4px;width:100%"></div><span style="color:var(--text-secondary)">--container-marketing · 1120px — site vitrine</span></div>
    <div style="color:var(--text-secondary)">--nav-height 68px · --tap-target-min 44px</div>
  </div>
</body></html>
