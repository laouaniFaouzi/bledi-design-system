<!-- @dsCard group="Colors" viewport="700x150" subtitle="L’or — confiance, vérification, CTA sur fond sombre" name="Colors Brand Gold" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);padding:20px;box-sizing:border-box}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
  .sw{border-radius:12px;height:56px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw span{font-size:10px;font-family:var(--font-mono),monospace}
  .grid{display:grid;gap:12px}

</style></head><body>
<div class="grid" style="grid-template-columns:repeat(5,1fr)"><div><div class="sw" style="background:#C99A22;border:1px solid var(--border-default)"><span style="color:#fff">#C99A22</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--bledi-gold-600</div></div><div><div class="sw" style="background:#E0A82E;border:1px solid var(--border-default)"><span style="color:#14161A">#E0A82E</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--bledi-gold-500</div></div><div><div class="sw" style="background:#E9B949;border:1px solid var(--border-default)"><span style="color:#14161A">#E9B949</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--bledi-gold-400</div></div><div><div class="sw" style="background:#EFC96F;border:1px solid var(--border-default)"><span style="color:#14161A">#EFC96F</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--bledi-gold-300</div></div><div><div class="sw" style="background:#FBF3DE;border:1px solid var(--border-default)"><span style="color:#14161A">#FBF3DE</span></div><div style="font-size:11px;margin-top:6px;color:var(--text-secondary)">--bledi-gold-100</div></div></div>
</body></html>
