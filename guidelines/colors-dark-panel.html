<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--color-bg);font-family:var(--font-sans);color:var(--text-primary);padding:20px;box-sizing:border-box}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
  .sw{border-radius:12px;height:56px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw span{font-size:10px;font-family:var(--font-mono),monospace}
  .grid{display:grid;gap:12px}

</style></head><body>
<div style="background:var(--gradient-panel);border-radius:20px;padding:24px;color:var(--text-on-dark)">
    <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-accent);font-weight:600">Trajet officiel</div>
    <div style="font-size:20px;font-weight:600;margin-top:8px">--gradient-panel</div>
    <div style="font-size:13px;color:var(--text-on-dark-muted);margin-top:4px">radial-gradient(120% 140% at 85% 0%, #1B5636, #0C3B26 45%, #072B1A)</div>
  </div>
